<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Prohlížeč</title>
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body class="viewer-body">

    <header class="viewer-header">
        <a href="index.html" class="btn-back">&larr; Zpět na úvod</a>
        <div class="viewer-title">Prohlížeč 3D modelu</div>
    </header>

    <main class="workspace">
        <!-- Kontejner pro 3D model -->
        <section id="model-viewport" class="viewport"></section>

        <!-- Boční panel s filtrem a popisky -->
        <aside class="info-panel">
            <!-- Filtr částí těla -->
            <div class="filter-section">
                <h3>Zobrazit část těla</h3>
                <div class="filter-buttons">
                    <button class="filter-btn active" data-filter="Vše">Celá kostra</button>
                    <button class="filter-btn" data-filter="Lebka">Lebka</button>
                    <button class="filter-btn" data-filter="Páteř">Páteř</button>
                    <button class="filter-btn" data-filter="Hrudník">Hrudník</button>
                    <button class="filter-btn" data-filter="Horní končetina">Horní končetina</button>
                    <button class="filter-btn" data-filter="Pánev">Pánev</button>
                    <button class="filter-btn" data-filter="Dolní končetina">Dolní končetina</button>
                </div>
            </div>

            <div class="panel-header">
                <h2>Detail vybrané části</h2>
                <span id="bone-category" class="badge">Vyberte kost</span>
            </div>

            <div class="panel-content">
                <p>Klikněte přímo na libovolnou kost na 3D modelu pro její zvýraznění a zobrazení informací.</p>
                
                <div class="detail-item">
                    <h3 id="bone-title">Žádná kost není vybrána</h3>
                    <p id="bone-desc">Po kliknutí na model se zde zobrazí název a popis dané kosti.</p>
                </div>
            </div>
        </aside>
    </main>

    <script type="module" src="script.js"></script>
</body>
</html>
