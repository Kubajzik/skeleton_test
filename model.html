<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Prohlížeč</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="viewer-body">

    <header class="viewer-header">
        <a href="index.html" class="btn-back">&larr; Zpět na úvod</a>
        <div class="viewer-title">Prohlížeč 3D modelu</div>
    </header>

    <main class="workspace">
        <!-- Kontejner pro jakýkoli 3D model -->
        <section id="model-viewport" class="viewport">
            <div class="placeholder-text">
                Zde se vykreslí 3D model
            </div>

            <!-- Vrstva připravená pro interaktivní body (hotspots) přímo v prostoru modelu -->
            <div class="hotspots-layer">
                <!-- Příklad bodu, který pak napojíš na model -->
                <button class="hotspot" style="top: 40%; left: 50%;" title="Ukázkový bod">1</button>
            </div>
        </section>

        <!-- Boční panel připravený pro popisky vybraných částí -->
        <aside class="info-panel">
            <div class="panel-header">
                <h2>Detail vybrané části</h2>
                <span class="badge">Kategorie / Typ</span>
            </div>
            <div class="panel-content">
                <p>Klikněte na libovolný bod na 3D modelu pro zobrazení podrobných informací a popisků k dané části.</p>
                
                <div class="detail-item">
                    <h3>Název prvku</h3>
                    <p>Zde se bude dynamicky měnit text podle toho, na jakou část modelu uživatel klikne.</p>
                </div>
            </div>
        </aside>
    </main>

</body>
</html>
