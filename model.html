<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Prohlížeč</title>
    <link rel="stylesheet" href="style.css">
    <!-- Import Three.js z CDN bez nutnosti instalace -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body class="viewer-body">

    <header class="viewer-header">
        <a href="index.html" class="btn-back">&larr; Zpět na úvod</a>
        <div class="viewer-title">Prohlížeč 3D modelu</div>
    </header>

    <main class="workspace">
        <!-- Kontejner, do kterého script.js vykreslí 3D kostru -->
        <section id="model-viewport" class="viewport"></section>

        <!-- Boční panel pro popisky vybraných kostí -->
        <aside class="info-panel">
            <div class="panel-header">
                <h2>Detail vybrané části</h2>
                <span id="bone-category" class="badge">Vyberte kost</span>
            </div>
            <div class="panel-content">
                <p>Klikněte přímo na libovolnou kost na 3D modelu pro její zvýraznění a zobrazení informací.</p>
                
                <div class="detail-item">
                    <h3 id="bone-title">Žádná kost není vybrána</h3>
                    <p id="bone-desc">Po kliknutí na model se zde zobrazí název a popis dané kosti.</p>
                </div>
            </div>
        </aside>
    </main>

    <script type="module" src="script.js"></script>
</body>
</html>
